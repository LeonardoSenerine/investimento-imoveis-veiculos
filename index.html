<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chave | Descubra quanto da sua casa ou do seu carro cabe no seu mês</title>
    <meta
      name="description"
      content="Informe quanto você pode investir por mês e veja na hora o crédito para planejar seu imóvel, carro ou moto. Atendimento especializado pelo WhatsApp."
    />
    <meta name="theme-color" content="#151515" />
    <link rel="canonical" href="%SITE_URL%/" />
    <!-- Capa de compartilhamento para WhatsApp, Instagram, Facebook e X.
         %SITE_URL% vem de VITE_SITE_URL (ver vite.config.ts). Ao trocar a capa,
         gere com `python scripts/og-image.py` e suba a versão do arquivo (v2, v3...). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Chave, planejamento de conquistas" />
    <meta property="og:title" content="Quanto da sua casa ou do seu carro cabe no seu mês?" />
    <meta
      property="og:description"
      content="Simule em segundos o crédito para seu imóvel, carro ou moto. Sem cadastro."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/assets/og/chave-og-v1.jpg" />
    <meta property="og:image:secure_url" content="%SITE_URL%/assets/og/chave-og-v1.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="Quanto cabe no seu mês? Ao lado, uma casa contemporânea iluminada ao pôr do sol e um exemplo de simulação: com R$ 2.800 por mês, R$ 495.000 de crédito estimado."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quanto da sua casa ou do seu carro cabe no seu mês?" />
    <meta
      name="twitter:description"
      content="Simule em segundos o crédito para seu imóvel, carro ou moto. Sem cadastro."
    />
    <meta name="twitter:image" content="%SITE_URL%/assets/og/chave-og-v1.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Foto do hero: baixada em paralelo ao JavaScript (melhora o LCP no celular).
         Mantenha em sincronia com IMAGES.hero e as larguras usadas em Hero.tsx. -->
    <link rel="preload" as="image" fetchpriority="high" imagesizes="100vw" imagesrcset="/assets/scenes/casa-piscina-828.webp 828w, /assets/scenes/casa-piscina-1440.webp 1440w, /assets/scenes/casa-piscina-2160.webp 2160w" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
